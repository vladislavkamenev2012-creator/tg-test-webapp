<!DOCTYPE html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<style>
		body{
			font: 10pt Tahoma;
		}
		
		table.form_holder1 {
			font: 10pt Tahoma;
			background-color: #ddeeff;
		}
		table.form_holder1 thead {
			background-color: #334466;
			color: white;
			font-weight: bold;
		}
	</style>
	<title>Cookie</title>
</head>
<body>
	<form name="frm1">
		<table class="form_holder1" cellspacing="1">
			<thead>
				<tr>
					<td colspan="2" align="center">Реєстрація на сервері:</td>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td>Логін</td>
					<td><input size="26" type="text" name="login" /></td>
				</tr>
				<tr>
					<td>Пароль</td>
					<td><input size="26" type="password" name="text_password1" /></td>
				</tr>
				<tr>
					<td>Підтвердження</td>
					<td><input size="26" type="password" name="text_password2" /></td>
				</tr>
				<tr>
					<td colspan="2" align="center"><hr />
					</td>
				</tr>
				<tr>
					<td>Повне ім'я (ПІБ)</td>
					<td><input size="26" type="text" name="fullname" /></td>
				</tr>
				<tr valign="top">
					<td>Стать</td>
					<td>	
						<input type="radio" name="radio_gender" value="male" />чоловіча<br />
						<input type="radio" name="radio_gender" value="female" />жіноча
					</td>
				</tr>
				<tr valign="top">
					<td>Іноземні<br />
						мови</td>
					<td>
						<input type="checkbox" name="check_languages" value="russian" />Російська<br />
						<input type="checkbox" name="check_languages" value="english" />Англійська<br />
						<input type="checkbox" name="check_languages" value="german" />Німецька<br />
						<input type="checkbox" name="check_languages" value="french" />Французька<br />
						<input type="checkbox" name="check_languages" value="spanish" />Іспанська<br />
						<input type="checkbox" name="check_languages" value="italian" />Італійська<br />
					</td>
				</tr>
				<tr>
					<td>Сфера діяльності</td>
					<td>
						<select name="list_work">
							<option value="0">обслуговування</option>
							<option value="1" selected>освіта</option>
							<option value="2">медицина</option>
							<option value="3">наука</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>e-mail</td>
					<td><input size="26" type="text" name="e_mail" /></td>
				</tr>
				<tr valign="top">
					<td>Додаткова<br />
						інформація</td>
					<td>
						<textarea name="text_info" cols="20" rows="5"></textarea></td>
				</tr>
				<tr>
					<td colspan="2" align="center">
						<input type="button" value="Готово" onclick="btn()" /> <input type="button" value="Очистити" onclick="clearForm()" />
					</td>
				</tr>
			</tbody>
		</table>
	</form>
	<script>
		let login = document.getElementsByName("login")[0]
		let pass = document.getElementsByName("text_password1")[0]
		let passMatch = document.getElementsByName("text_password2")[0]
		let fullName = document.getElementsByName("fullname")[0]
		let email = document.getElementsByName("e_mail")[0]
		let a_info = document.getElementsByName("text_info")[0]
		let form = document.forms.frm1

		function btn(){
			let gender = form.querySelector('input[name="radio_gender"]:checked')
			let checkboxes = form.querySelectorAll('input[name="check_languages"]:checked')
			let languages = Array.from(checkboxes).map(cb => cb.value)

			if (!login.value.trim() || !pass.value || !passMatch.value || !fullName.value.trim() || !email.value.trim() || !gender || languages.length === 0 || !a_info.value.trim()) {
				alert("Вы не заполнили все поля.")
				return
			}
			if (pass.value !== passMatch.value) {
				alert("Пароли не совпадают.")
				return
			}
			let d = new Date()
			d.setMonth(d.getMonth() + 6)
			document.cookie = "LOGIN=" + encodeURIComponent(login.value) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "PASSWORD=" + encodeURIComponent(pass.value) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "FULLNAME=" + encodeURIComponent(fullName.value) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "EMAIL=" + encodeURIComponent(email.value) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "INFO=" + encodeURIComponent(a_info.value) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "GENDER=" + encodeURIComponent(gender.value) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "LANGUAGES=" + encodeURIComponent(languages) + ";path=/;expires=" + d.toUTCString() + ";";
			document.cookie = "WORK=" + encodeURIComponent(form.list_work.value) + ";path=/;expires=" + d.toUTCString() + ";";
		}

		function getCookie(name){
			let cookies = document.cookie.split("; ")
			let cookie = cookies.find(item => item.startsWith(name + "="))
			return cookie ? decodeURIComponent(cookie.substring(name.length + 1)) : ""
		}

		function loadForm(){
			login.value = getCookie("LOGIN")
			pass.value = getCookie("PASSWORD")
			passMatch.value = getCookie("PASSWORD")
			fullName.value = getCookie("FULLNAME")
			email.value = getCookie("EMAIL")
			a_info.value = getCookie("INFO")
			form.list_work.value = getCookie("WORK")

			let savedGender = getCookie("GENDER")
			let gender = form.querySelector('input[name="radio_gender"][value="' + savedGender + '"]')
			if (gender) gender.checked = true

			let savedLanguages = getCookie("LANGUAGES").split(",")
			form.querySelectorAll('input[name="check_languages"]').forEach(input => {
				input.checked = savedLanguages.includes(input.value)
			})
		}

		function clearForm(){
			form.reset()
			form.querySelectorAll('input[name="radio_gender"], input[name="check_languages"]').forEach(input => input.checked = false)
			form.list_work.selectedIndex = -1
			a_info.value = ""
		}

		loadForm()
	</script>
</body>
